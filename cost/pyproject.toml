[project]
name = "cost-model"
version = "0.1.0"
description = "Yearly AWS cost of Cartridge, Elasticsearch, OpenSearch and Elastic Serverless at a given daily log volume, from measured stored sizes"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyyaml>=6",
]

[project.scripts]
cost-matrix = "cost_model.matrix:cli"
cost-oneyear = "cost_model.oneyear:cli"
cost-tiered = "cost_model.tiered:cli"
cost-lines = "cost_model.lines:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_model"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
