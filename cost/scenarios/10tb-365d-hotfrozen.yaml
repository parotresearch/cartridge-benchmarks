# Elasticsearch on Elastic's hot/frozen reference architecture for Observability (https://www.elastic.co/docs/deploy-manage/reference-architectures/hotfrozen-high-availability): 7 days hot, the rest frozen (searchable snapshots,
# which need the Enterprise licence; the estimate is included).
name: 10tb-365d-hotfrozen
label: "ES hot/frozen on Enterprise: ASSUMED 10 TB/day, 365 days searchable (7 hot + 358 frozen)"
tb_per_day: 10
retention:
  hot_days: 7
  warm_days: 0
  frozen_days: 358
replicas: 1                # 1 replica
queries_per_day: 100000    # 100K searches a day assumed
query_window_days: 0.0416667   # each search covers the last hour; only moves Elasticsearch CPU sizing, which does not bind (disk does)
query_mix: {hot: 0.9, warm: 0.0, frozen: 0.1}
region: us-east-2
es_instance: i8g.4xlarge   # 3,750 GB local NVMe per node
es_min_hot_nodes: 3
target_cpu_utilization: 1.0  # build servers sized at full machine rate
cartridge_build_instance: r7i.4xlarge   # build servers
cartridge_query_instance: c7i.4xlarge
cartridge_query_nodes: 4     # assumed fleet size, not sized from a measurement
cartridge_local_days: 7      # last 7 days kept on local gp3
cartridge_local_headroom: 0  # no free-space headroom on the Cartridge local copy
cartridge_gets_per_query: 1000  # S3 GETs per search, charged on every search
